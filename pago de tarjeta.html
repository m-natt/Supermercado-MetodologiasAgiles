<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago con tarjeta</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101827, #1d3557);
      color: #172033;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .container {
      width: min(100%, 460px);
      background: #fff;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 18px 55px #0005;
    }
    h1 { margin: 0 0 8px; font-size: 25px; }
    .subtitle { color: #64748b; margin: 0 0 22px; font-size: 14px; }
    .card-preview {
      height: 190px;
      border-radius: 16px;
      padding: 22px;
      color: white;
      margin-bottom: 25px;
      background: linear-gradient(125deg, #182848, #4b6cb7);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 24px #243b6040;
    }
    .card-top, .card-bottom { display: flex; justify-content: space-between; align-items: center; }
    .chip { width: 42px; height: 30px; border-radius: 7px; background: #d7dce5; }
    .brand { font-weight: bold; font-size: 18px; letter-spacing: 1px; }
    .number-preview { font-size: 20px; letter-spacing: 2px; }
    .card-label { font-size: 10px; opacity: .75; margin-bottom: 5px; }
    .card-value { font-size: 13px; text-transform: uppercase; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 7px; }
    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 13px;
      font-size: 15px;
      outline: none;
      transition: border .2s;
    }
    input:focus { border-color: #315ea8; box-shadow: 0 0 0 3px #315ea820; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .amount-box {
      background: #f1f5f9;
      border-radius: 10px;
      padding: 14px;
      margin: 7px 0 18px;
    }
    .amount-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 9px;
    }
    .amount-box strong { font-size: 21px; color: #1d4ed8; }
    .amount-input {
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 0 12px;
    }
    .amount-input span { color: #64748b; font-weight: bold; }
    .amount-input input {
      border: 0;
      box-shadow: none;
      text-align: right;
      font-weight: bold;
      font-size: 19px;
      padding: 11px 0;
    }
    .amount-input input:focus { box-shadow: none; }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      background: #2456a6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #194586; }
    button:disabled { opacity: .65; cursor: wait; }
    .secure { text-align: center; color: #64748b; font-size: 12px; margin: 15px 0 0; }
    .message { display: none; padding: 16px; border-radius: 10px; margin-top: 17px; line-height: 1.5; }
    .success { display: block; background: #dcfce7; color: #166534; }
    .error { display: block; background: #fee2e2; color: #991b1b; }
    .receipt { font-size: 13px; margin-top: 8px; }
    @media (max-width: 420px) {
      .container { padding: 22px; }
      .number-preview { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Pago con tarjeta</h1>
    <p class="subtitle">Completa los datos para realizar tu pago de prueba.</p>

    <section class="card-preview" aria-label="Vista previa de tarjeta">
      <div class="card-top">
        <div class="chip"></div>
        <div class="brand">CARD</div>
      </div>
      <div class="number-preview" id="previewNumber">•••• •••• •••• ••••</div>
      <div class="card-bottom">
        <div>
          <div class="card-label">TITULAR</div>
          <div class="card-value" id="previewName">NOMBRE DEL TITULAR</div>
        </div>
        <div>
          <div class="card-label">VENCE</div>
          <div class="card-value" id="previewDate">MM/AA</div>
        </div>
      </div>
    </section>

    <form id="paymentForm">
      <div class="field">
        <label for="name">Nombre del titular</label>
        <input id="name" type="text" placeholder="Como aparece en la tarjeta" autocomplete="off" required maxlength="60">
      </div>

      <div class="field">
        <label for="number">Número de tarjeta de prueba</label>
        <input id="number" type="text" inputmode="numeric" placeholder="4242 4242 4242 4242" maxlength="19" autocomplete="off" required>
      </div>

      <div class="row">
        <div class="field">
          <label for="expiry">Vencimiento</label>
          <input id="expiry" type="text" inputmode="numeric" placeholder="MM/AA" maxlength="5" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="cvv">CVV de prueba</label>
          <input id="cvv" type="password" inputmode="numeric" placeholder="123" maxlength="4" autocomplete="off" required>
        </div>
      </div>

      <div class="amount-box">
        <div class="amount-top">
          <label for="amountInput" style="margin:0">Total a pagar</label>
          <span style="font-size:12px;color:#64748b">MXN</span>
        </div>
        <div class="amount-input">
          <span>$</span>
          <input id="amountInput" type="number" min="0.01" max="999999.99" step="0.01" value="250.00" required aria-label="Monto a cobrar en pesos mexicanos">
        </div>
      </div>

      <button type="submit" id="payButton">Pagar ahora</button>
      <p class="secure">🔒 Pago protegido</p>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById('paymentForm');
    const numberInput = document.getElementById('number');
    const nameInput = document.getElementById('name');
    const expiryInput = document.getElementById('expiry');
    const cvvInput = document.getElementById('cvv');
    const amountInput = document.getElementById('amountInput');
    const message = document.getElementById('message');
    const payButton = document.getElementById('payButton');

    // Muestra únicamente los últimos cuatro dígitos en la vista previa.
    numberInput.addEventListener('input', () => {
      const digits = numberInput.value.replace(/\D/g, '').slice(0, 16);
      numberInput.value = digits.replace(/(.{4})/g, '$1 ').trim();
      const lastFour = digits.slice(-4).padStart(4, '•');
      document.getElementById('previewNumber').textContent =
        digits.length ? `•••• •••• •••• ${lastFour}` : '•••• •••• •••• ••••';
    });

    nameInput.addEventListener('input', () => {
      document.getElementById('previewName').textContent =
        nameInput.value.trim().toUpperCase() || 'NOMBRE DEL TITULAR';
    });

    expiryInput.addEventListener('input', () => {
      let digits = expiryInput.value.replace(/\D/g, '').slice(0, 4);
      if (digits.length > 2) digits = digits.slice(0, 2) + '/' + digits.slice(2);
      expiryInput.value = digits;
      document.getElementById('previewDate').textContent = digits || 'MM/AA';
    });

    cvvInput.addEventListener('input', () => {
      cvvInput.value = cvvInput.value.replace(/\D/g, '').slice(0, 4);
    });

    function luhnIsValid(digits) {
      let sum = 0;
      let doubleDigit = false;
      for (let i = digits.length - 1; i >= 0; i--) {
        let digit = Number(digits[i]);
        if (doubleDigit) {
          digit *= 2;
          if (digit > 9) digit -= 9;
        }
        sum += digit;
        doubleDigit = !doubleDigit;
      }
      return sum % 10 === 0;
    }

    function expiryIsValid(value) {
      if (!/^\d{2}\/\d{2}$/.test(value)) return false;
      const [month, year] = value.split('/').map(Number);
      if (month < 1 || month > 12) return false;
      const now = new Date();
      const currentYear = now.getFullYear() % 100;
      return year > currentYear || (year === currentYear && month >= now.getMonth() + 1);
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      message.className = 'message';
      message.textContent = '';

      const digits = numberInput.value.replace(/\D/g, '');
      const amount = Number(amountInput.value);
      if (!Number.isFinite(amount) || amount <= 0 || amount > 999999.99) {
        showError('Ingresa un monto válido mayor a $0.00 y menor o igual a $999,999.99 MXN.');
        return;
      }
      if (nameInput.value.trim().length < 3) {
        showError('Escribe el nombre del titular.');
        return;
      }
      if (digits.length !== 16 || !luhnIsValid(digits)) {
        showError('El número de tarjeta no es válido. Usa una tarjeta de prueba.');
        return;
      }
      if (!expiryIsValid(expiryInput.value)) {
        showError('Revisa la fecha de vencimiento.');
        return;
      }
      if (!/^\d{3,4}$/.test(cvvInput.value)) {
        showError('El CVV debe tener 3 o 4 dígitos.');
        return;
      }

      // Tarjetas de prueba: 4242 4242 4242 4242 aprueba; 4000 0000 0000 0002 rechaza.
      if (digits === '4000000000000002') {
        showError('Pago rechazado (simulación). Intenta con otra tarjeta de prueba.');
        return;
      }
      if (digits !== '4242424242424242') {
        showError('Tarjeta no reconocida. Para aprobar la prueba usa 4242 4242 4242 4242.');
        return;
      }

      payButton.disabled = true;
      payButton.textContent = 'Procesando...';
      setTimeout(() => {
        const folio = 'SIM-' + Math.random().toString(36).slice(2, 8).toUpperCase();
        message.className = 'message success';
        const formattedAmount = amount.toLocaleString('es-MX', { style: 'currency', currency: 'MXN' });
        message.innerHTML = `<strong>¡Pago aprobado!</strong><div class="receipt">Folio: ${folio}<br>Importe: ${formattedAmount}<br><span style="font-size:11px">Comprobante de demostración; no se realizó un cobro real.</span></div>`;
        payButton.disabled = false;
        payButton.textContent = 'Pagar ahora';
        form.reset();
        document.getElementById('previewNumber').textContent = '•••• •••• •••• ••••';
        document.getElementById('previewName').textContent = 'NOMBRE DEL TITULAR';
        document.getElementById('previewDate').textContent = 'MM/AA';
      }, 1200);
    });

    function showError(text) {
      message.className = 'message error';
      message.textContent = text;
    }
  </script>
</body>
</html>
